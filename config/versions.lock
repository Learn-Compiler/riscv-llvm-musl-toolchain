# ==============================================================================
# config/versions.lock - 官方发行版本清单 (Release 发布版本基准)
# ==============================================================================
# 本文件为工具链核心三元组版本绑定的单一事实来源 (Single Source of Truth)。
# 统一采用官方发行版发布分支 (Release Branch) 或正式发布标签 (Release Tag)，
# 不使用任何生涩的 40 位 Git Commit SHA。
#
# 支持格式:
#   - LLVM: release/23.x (推荐), llvmorg-23.1.3, 或 release/21.x (21.1 稳定线)
#   - torch-mlir: v20261001 (官方正式 Release Tag) 或 main
#   - musl: v1.2.5 (官方稳定 Release Tag)
#
# 命令行随时覆盖:
#   ./build.sh --llvm-version release/23.x --torch-mlir-version v20261001
# ==============================================================================

# 1. LLVM 核心版本 (官方正式发布分支/标签)
LLVM_REF="${LLVM_REF:-llvmorg-23.1.4}"
LLVM_REPO="${LLVM_REPO:-https://github.com/llvm/llvm-project.git}"

# 2. torch-mlir 核心版本 (官方正式发布标签)
TORCH_MLIR_REF="${TORCH_MLIR_REF:-v20261001}"
TORCH_MLIR_REPO="${TORCH_MLIR_REPO:-https://github.com/llvm/torch-mlir.git}"

# 3. 目标端 Musl C 运行库 (稳定发布标签)
MUSL_REF="${MUSL_REF:-v1.2.5}"
MUSL_REPO="${MUSL_REPO:-https://github.com/kraj/musl.git}"

# 4. Linux 内核 UAPI 头文件
LINUX_HEADERS_REF="${LINUX_HEADERS_REF:-master}"
LINUX_HEADERS_REPO="${LINUX_HEADERS_REPO:-https://github.com/sabotage-linux/kernel-headers.git}"
